$kind: http-request
auth:
  type: inherit
  credentials:
    id: 8fc7cbe0-a20c-4c96-98fb-8978f798df9b
order: 2000
method: POST
url: "{{base_url}}/api/v1/auth/login"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "testbilllocket01@example.com",
      "password": "{{test_password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();

      if (pm.response.code === 200 && json.accessToken) {
          pm.collectionVariables.set("access_token", json.accessToken);
          pm.collectionVariables.set("refresh_token", json.refreshToken);

          console.log("Login successful - Tokens saved!");
      }
    language: text/javascript
